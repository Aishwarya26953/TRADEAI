<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080c12"><title>Sign in · TRADEAI</title><link rel="stylesheet" href="/theme.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 55% 0,#17352f 0,transparent 45%),var(--bg)}.auth-card{width:100%;max-width:410px;padding:32px;border:1px solid var(--line);border-radius:17px;background:#0c141def;box-shadow:0 28px 90px #0008}.auth-brand{display:flex;align-items:center;gap:11px;margin-bottom:35px}.auth-brand strong{letter-spacing:.14em;font-size:17px}.auth-card h1{font-size:26px;letter-spacing:-.04em;margin:10px 0}.auth-card p{color:var(--muted);line-height:1.65;font-size:12px}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:11px;color:#a8b7c5}.field input{width:100%;background:#080e14;border:1px solid #2a3b48;border-radius:9px;padding:13px;color:var(--text);outline:none}.field input:focus{border-color:var(--mint)}.auth-card .btn{width:100%;height:43px;margin-top:8px}.auth-card button:disabled{opacity:.5}.auth-msg{min-height:20px;margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}.auth-msg.err{color:var(--red)}[hidden]{display:none!important}.fineprint{margin-top:23px;padding-top:16px;border-top:1px solid var(--line);font-size:10px!important}
</style></head>
<body><main class="auth-card">
<a href="/" class="auth-brand"><span class="brandmark">T</span><span><strong>TRADEAI</strong><span class="muted" style="display:block;font-size:10px;letter-spacing:.1em;margin-top:3px">NEURAL TERMINAL</span></span></a>
<div class="eyebrow">SECURE ACCOUNT ACCESS</div><h1 id="title">Welcome back.</h1><p id="subtitle">Sign in or create an account with a one-time code sent to your email. No password is needed.</p>
<form id="authForm" novalidate><div class="field" id="emailField"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" autocapitalize="off" autocorrect="off" spellcheck="false" required placeholder="you@example.com"></div>
<div class="field" id="codeField" hidden><label for="code">One-time code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="Enter the code"></div>
<button id="submit" type="submit" class="btn btn-primary">Send sign-in code</button><button id="back" type="button" class="btn" hidden>Use a different email</button></form>
<div id="passkeyOffer" hidden><button id="addPasskey" class="btn btn-primary" type="button">Add a passkey</button><button id="skipPasskey" class="btn" type="button">Not now</button></div>
<div id="message" class="auth-msg" role="status" aria-live="polite"></div>
<p class="fineprint">Your account protects your private watchlists and strategy specifications. TRADEAI never asks for your broker password, PIN or OTP.</p>
</main>
<script>
(function(){
 const A=window.hatchable&&window.hatchable.auth;
 const $=id=>document.getElementById(id);
 const form=$('authForm'),email=$('email'),code=$('code'),submit=$('submit'),back=$('back'),msg=$('message');
 let step='email',hasPasskey=false;
 function say(s,err){msg.textContent=s||'';msg.className='auth-msg'+(err?' err':'')}
 function nextPath(){const raw=new URLSearchParams(location.search).get('next')||'/';if(raw[0]!=='/'||raw[1]==='/')return '/';for(let i=0;i<raw.length;i++){const c=raw.charCodeAt(i);if(c<32||c===92||c===127)return '/'}return raw}
 function done(){location.replace(nextPath())}
 function declined(){try{return localStorage.getItem('tradeai_passkey_declined')==='1'}catch{return false}}
 function decline(){try{localStorage.setItem('tradeai_passkey_declined','1')}catch{}}
 function finish(){if(hasPasskey||declined()||!A.registerPasskey||!A.supportsPasskeys||!A.supportsPasskeys()){done();return}
   form.hidden=true;$('title').textContent='Secure your sign-in';$('subtitle').textContent='Add a passkey to sign in next time with your fingerprint, face or device screen lock.';$('passkeyOffer').hidden=false;$('addPasskey').focus()}
 if(!A){say('Sign-in is currently unavailable. Refresh and try again.',true);submit.disabled=true;return}
 A.getSession().then(s=>{if(s&&s.user)done()}).catch(()=>{});
 if(A.attachPasskeyAutofill){try{A.attachPasskeyAutofill(email).then(r=>{if(r&&r.user)done()}).catch(()=>{})}catch{}}
 $('addPasskey').addEventListener('click',async()=>{ $('addPasskey').disabled=true;$('skipPasskey').disabled=true;try{const r=await A.registerPasskey();if(!r)decline();done()}catch(e){$('addPasskey').disabled=false;$('skipPasskey').disabled=false;say(e.message||'Passkey could not be saved. You can continue without one.',true)}});
 $('skipPasskey').addEventListener('click',()=>{decline();done()});
 back.addEventListener('click',()=>{step='email';$('codeField').hidden=true;$('emailField').hidden=false;back.hidden=true;submit.textContent='Send sign-in code';$('subtitle').textContent='Sign in or create an account with a one-time code sent to your email. No password is needed.';say('');email.focus()});
 form.addEventListener('submit',async e=>{e.preventDefault();if(step==='passkey')return;submit.disabled=true;
   if(step==='email'){const value=email.value.trim();if(!value){say('Enter your email address.',true);submit.disabled=false;return}
     try{const r=await A.startLogin({email:value});hasPasskey=!!(r&&r.has_passkey);
       if(hasPasskey&&A.supportsPasskeys&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email:value});if(d&&d.user){done();return}}catch{}}
       step='code';$('emailField').hidden=true;$('codeField').hidden=false;back.hidden=false;submit.textContent='Verify and sign in';$('subtitle').textContent='Enter the one-time code sent to '+value+'.';say('Code sent. Check your inbox and spam folder.');code.focus();
     }catch(err){say(err&&err.status===429?'Too many attempts. Please wait before trying again.':((err&&err.message)||'Could not send a code. Check the email and try again.'),true)}
     submit.disabled=false;return;
   }
   try{const result=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(result&&result.user){finish();return}say('That code could not be verified.',true)}
   catch(err){say((err&&err.message)||'That code could not be verified. Try again.',true)}
   submit.disabled=false;
 });
 email.focus();
})();
</script></body></html>
